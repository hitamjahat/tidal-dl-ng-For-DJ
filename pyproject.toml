[project]
name = "tidal-dl-ng-for-dj"
authors = [{ name = "Warry", email = "<warry@exemple.com>" }]
version = "0.32.1"
description = "TIDAL Media Downloader Next Generation!"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
]
# Updated to support Python 3.14.
# (You can use ">=3.14" if you want to strictly drop 3.12/3.13 support)
requires-python = ">=3.14"

dependencies = [
  "requests~=2.34.2",
  "mutagen>=1.48.1",
  "dataclasses-json>=0.6.7",
  "pathvalidate>=3.3.1",
  "m3u8>=6.0.0",
  "coloredlogs>=15.0.1",
  "rich>=15.0.0",
  "toml>=0.10.2",
  "typer>=0.27.0",
  "tidalapi>=0.8.11",
  "python-ffmpeg>=2.0.12",
  "pycryptodome>=3.23.0",
  "ansi2html>=1.9.2",
  "pyside6>=6.11.1",
  "pyqtdarktheme-fork>=2.3.6",
  "httpx>=0.28.0",
]

[project.urls]
repository = "https://github.com/FunWarry/tidal-dl-ng-For-DJ"
documentation = "https://FunWarry.github.io/tidal-dl-ng-For-DJ/"

[project.scripts]
tidal-dl-ng = "tidal_dl_ng.cli:app"
tidal-dl-ng-gui = "tidal_dl_ng.gui:gui_activate"
tdn = "tidal_dl_ng.cli:app"
tdng = "tidal_dl_ng.gui:gui_activate"

[tool.poetry]
packages = [{ include = "tidal_dl_ng" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
deptry = "^0.25.1"
mypy = "^2.3.0"
pre-commit = "^4.6.0"
tox = "^4.56.4"
mypy-extensions = "^1.1.0"
pylint = "^4.0.6"
pillow = "^12.3.0"
pytest-cov = "^7.1.0"
nuitka = "^4.1.3"
ruff = "^0.4.0" # Added Ruff directly as it now replaces Black, isort, bandit, etc.

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.6"
mkdocstrings = { extras = ["python"], version = "^1.0.6" }
griffe = "^2.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314" # Updated for Python 3.14
line-length = 79
fix = true
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "env",
    "venv",
    "site",
    "docs",
    "tidal_dl_ng/ui/main.py",
    "tidal_dl_ng/ui/dialog_version.py",
]

# Enable ALL rules to maximize strictness, efficiency, and performance profiling
lint.select = ["ALL"]
lint.ignore = [
  "COM812",
  "ISC001",
  "TD003",
  "FIX002",
  "ANN401",
  "ARG001",
  "FBT001",
  "FBT002",
  "PLR0913",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Ported from your legacy [tool.isort] configuration
section-order = ["future", "typing", "standard-library", "third-party", "first-party", "local-folder"]
known-third-party = [
  "Crypto",
  "PySide6",
  "coloredlogs",
  "dataclasses_json",
  "ffmpeg",
  "m3u8",
  "mutagen",
  "pathvalidate",
  "requests",
  "rich",
  "tidalapi",
  "toml",
  "typer",
]

[tool.ruff.lint.isort.sections]
"typing" = ["typing", "types", "typing_extensions", "mypy", "mypy_extensions"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = [
  "getNum",
  "getItem",
  "isItemValid",
  "getItems",
  "getLimitIndexs",
  "getVersion",
  "sizeHint",
  "updateGeometries",
  "lessThan",
  "filterAcceptsRow",
  "MediaUnknown",
  "UnknownManifestFormat",
  "MediaMissing",
  "HashKey",
  "File",
  "Ui_DialogHistory",
  "Ui_DialogLogin",
  "Ui_DialogSettings",
  "Ui_DialogVersion",
  "setupUi",
  "retranslateUi",
  "main",
  "featured",
  "contributor",
  "artist",
  "welcome_mix",
  "video_daily",
  "daily",
  "discovery",
  "new_release",
  "track",
  "songwriter",
  "producter",
  "history_alltime",
  "history_monthly",
  "history_yearly",
  "low_96k",
  "low_320k",
  "high_lossless",
  "hi_res_lossless",
  "default",
  "high",
  "medium",
  "low",
  "audio_only",
  "stereo",
  "dolby_atmos",
  "lossless",
  "Atmos",
  "LowResCodecs",
  "PremiumCodecs",
  "HQCodecs",
  "audio_mpeg",
  "audio_mp3",
  "audio_mp4",
  "audio_m4a",
  "audio_flac",
  "audio_xflac",
  "audio_eac3",
  "audio_ac4",
  "audio_m3u8",
  "video_mp4",
  "video_m3u8",
  "audio_map",
  "Artist",
  "DateAdded",
  "Name",
  "ReleaseDate",
]

[tool.mypy]
files = ["tidal_dl_ng"]
mypy_path = "stubs"
python_version = "3.14" # Updated for Python 3.14
pretty = true
show_traceback = true
color_output = true
strict = true
allow_redefinition = false
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
disallow_any_expr = false
disallow_any_decorated = true
disallow_any_explicit = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = false
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true

[tool.deptry]
extend_exclude = []
per_rule_ignores = { DEP003 = ["shiboken6"] }

[tool.pylint]
max-line-length = 79
disable = [
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-locals",
  "too-many-boolean-expressions",
  "broad-exception-caught",
  "unused-argument",
  "keyword-arg-before-vararg",
  "abstract-method",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
]
extension-pkg-allow-list = ["PySide6", "shiboken6"]
generated-members = [".*\\.connect", ".*\\.disconnect", ".*\\.emit"]
load-plugins = [
  "pylint.extensions.bad_builtin",
  "pylint.extensions.check_elif",
  "pylint.extensions.code_style",
  "pylint.extensions.empty_comment",
  "pylint.extensions.for_any_all",
  "pylint.extensions.mccabe",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.private_import",
  "pylint.extensions.set_membership",
  "pylint.extensions.typing",
]
good-names = ["TConfigData", "_", "T", "HashKey", "File", "Ui_DialogHistory", "Ui_DialogLogin", "Ui_DialogSettings", "Ui_DialogVersion"]
good-names-rgxs = [
  "^getNum$",
  "^getItem$",
  "^isItemValid$",
  "^getItems$",
  "^getLimitIndexs$",
  "^getVersion$",
  "^sizeHint$",
  "^updateGeometries$",
  "^lessThan$",
  "^filterAcceptsRow$",
  "^setupUi$",
  "^retranslateUi$",
  "^main$",
  "^featured$",
  "^contributor$",
  "^artist$",
  "^low_96k$",
  "^low_320k$",
  "^high_lossless$",
  "^hi_res_lossless$",
  "^default$",
  "^high$",
  "^medium$",
  "^low$",
  "^audio_only$",
  "^stereo$",
  "^dolby_atmos$",
  "^lossless$",
  "^Atmos$",
  "^LowResCodecs$",
  "^PremiumCodecs$",
  "^HQCodecs$",
  "^audio_mpeg$",
  "^audio_mp3$",
  "^audio_mp4$",
  "^audio_m4a$",
  "^audio_flac$",
  "^audio_xflac$",
  "^audio_eac3$",
  "^audio_ac4$",
  "^audio_m3u8$",
  "^video_mp4$",
  "^video_m3u8$",
  "^audio_map$",
  "^Artist$",
  "^DateAdded$",
  "^Name$",
  "^ReleaseDate$",
  "^welcome_mix$",
  "^video_daily$",
  "^daily$",
  "^discovery$",
  "^new_release$",
  "^track$",
  "^songwriter$",
  "^producter$",
